<svg width="760" height="360" viewBox="0 0 760 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="360" fill="#F7F9FB"/>
  <rect x="40" y="30" width="180" height="80" rx="12" fill="#1A5FD0" fill-opacity="0.12" stroke="#1A5FD0" stroke-width="2"/>
  <text x="130" y="75" text-anchor="middle" fill="#0F172A" font-family="Inter, sans-serif" font-size="16" font-weight="700">Orchestrator</text>
  <text x="130" y="96" text-anchor="middle" fill="#334155" font-family="Inter, sans-serif" font-size="12">Plan + control</text>

  <rect x="300" y="30" width="180" height="80" rx="12" fill="#1A5FD0" fill-opacity="0.12" stroke="#1A5FD0" stroke-width="2"/>
  <text x="390" y="70" text-anchor="middle" fill="#0F172A" font-family="Inter, sans-serif" font-size="16" font-weight="700">Model Gateway</text>
  <text x="390" y="91" text-anchor="middle" fill="#334155" font-family="Inter, sans-serif" font-size="12">Routes • Safety • Budgets</text>

  <rect x="560" y="30" width="160" height="80" rx="12" fill="#1A5FD0" fill-opacity="0.12" stroke="#1A5FD0" stroke-width="2"/>
  <text x="640" y="75" text-anchor="middle" fill="#0F172A" font-family="Inter, sans-serif" font-size="16" font-weight="700">Providers</text>
  <text x="640" y="96" text-anchor="middle" fill="#334155" font-family="Inter, sans-serif" font-size="12">LLMs • Tools</text>

  <rect x="40" y="170" width="160" height="80" rx="12" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="2"/>
  <text x="120" y="210" text-anchor="middle" fill="#0F172A" font-family="Inter, sans-serif" font-size="15" font-weight="700">Policy Store</text>
  <text x="120" y="231" text-anchor="middle" fill="#334155" font-family="Inter, sans-serif" font-size="12">Prompts • Tools • Budgets</text>

  <rect x="300" y="170" width="180" height="80" rx="12" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="2"/>
  <text x="390" y="210" text-anchor="middle" fill="#0F172A" font-family="Inter, sans-serif" font-size="15" font-weight="700">Resilience Layer</text>
  <text x="390" y="231" text-anchor="middle" fill="#334155" font-family="Inter, sans-serif" font-size="12">Retries • Fallbacks • Compensate</text>

  <rect x="560" y="170" width="160" height="80" rx="12" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-width="2"/>
  <text x="640" y="210" text-anchor="middle" fill="#0F172A" font-family="Inter, sans-serif" font-size="15" font-weight="700">Observability</text>
  <text x="640" y="231" text-anchor="middle" fill="#334155" font-family="Inter, sans-serif" font-size="12">Traces • Metrics • Alerts</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#1A5FD0" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#10B981" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#8B5CF6" />
    </marker>
  </defs>

  <line x1="220" y1="70" x2="300" y2="70" stroke="#1A5FD0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="70" x2="560" y2="70" stroke="#1A5FD0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="220" y1="90" x2="300" y2="90" stroke="#1A5FD0" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 6"/>
  <line x1="480" y1="90" x2="560" y2="90" stroke="#1A5FD0" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 6"/>

  <line x1="130" y1="110" x2="130" y2="170" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="390" y1="110" x2="390" y2="170" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="640" y1="110" x2="640" y2="170" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <text x="200" y="145" text-anchor="end" fill="#64748B" font-family="Inter, sans-serif" font-size="11">Policies</text>
  <text x="460" y="145" text-anchor="end" fill="#64748B" font-family="Inter, sans-serif" font-size="11">Retries • Fallbacks</text>
  <text x="710" y="145" text-anchor="end" fill="#64748B" font-family="Inter, sans-serif" font-size="11">Telemetry</text>
</svg>
